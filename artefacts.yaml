version: 0.1.0

project: artefacts/navigation2-ignition-example

jobs:
  nav2:
    type: test
    package:
      docker:
        build:
          dockerfile: ./docker/Dockerfile
    runtime:
      simulator: gazebo:fortress
      framework: null
    timeout: 15 #minutes
    scenarios:
      defaults: # Global to all scenarios, and overriden in specific scenarios.
        output_dirs: ["output", "rosbags"]
        metrics:
          - /odometry_error
          - /distance_from_start_gt
          - /distance_from_start_est
        params:
          launch/world: ["arena.sdf", "bookstore.sdf", "depot.sdf"]
          launch/headless: "True"
      settings:
        - name: follow_waypoints
          run: >
            python3 -m pytest 
            src/nav2_gz_testing/test/test_follow_waypoints.py 
            --html=output/report.html 
            --self-contained-html 
            -s &&
            pkill -f gz &&
            pkill -f rviz
